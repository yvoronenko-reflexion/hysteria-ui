name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pin to a hysteria tag (e.g. "app/v2.6.2") for reproducible builds, or "latest".
  HYSTERIA_RELEASE: app/v2.13.0

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "This workflow must run on a v* tag, got ref '$TAG'." >&2
            exit 1
          fi
          # Take the id from the create response itself: listing releases right after
          # creating a draft can miss it, which made tauri-action silently skip uploads.
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
                 -f tag_name="$TAG" -f name="Hysteria Client $TAG" \
                 -F draft=true -F generate_release_notes=true --jq .id)
          if [ -z "$id" ]; then
            echo "Failed to create release for $TAG" >&2
            exit 1
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            hysteria_asset: hysteria-darwin-arm64
          # GitHub retired the macos-13 Intel runners; cross-compile x86_64 on arm64.
          - runner: macos-14
            target: x86_64-apple-darwin
            hysteria_asset: hysteria-darwin-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Set version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          npm version --no-git-tag-version --allow-same-version "$VERSION"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp src-tauri/tauri.conf.json
          sed -i '' -E "1,/^version = /s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Download hysteria binary
        env:
          ASSET: ${{ matrix.hysteria_asset }}
        run: |
          mkdir -p src-tauri/binaries
          if [ "$HYSTERIA_RELEASE" = "latest" ]; then
            URL="https://github.com/apernet/hysteria/releases/latest/download/$ASSET"
          else
            URL="https://github.com/apernet/hysteria/releases/download/$HYSTERIA_RELEASE/$ASSET"
          fi
          curl -fL --retry 3 -o src-tauri/binaries/hysteria "$URL"
          chmod +x src-tauri/binaries/hysteria
          file src-tauri/binaries/hysteria

      - run: npm ci

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}
